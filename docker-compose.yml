name: artiflow-integration

services:
  postgres:
    image: postgres:16-alpine
    pull_policy: never
    environment:
      POSTGRES_DB: artiflow
      POSTGRES_USER: artiflow_test
      POSTGRES_PASSWORD: artiflow_test_local_only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artiflow_test -d artiflow"]
      interval: 2s
      timeout: 5s
      retries: 30

  garage:
    image: dxflrs/garage:v2.4.1
    pull_policy: never
    command: /garage server --single-node --default-bucket
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_DEFAULT_ACCESS_KEY: GK0123456789abcdef0123456789
      GARAGE_DEFAULT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_BUCKET: artiflow-integration
    ports:
      - "127.0.0.1:9001:9000"
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "health", "--quiet"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  garage-meta:
  garage-data:
