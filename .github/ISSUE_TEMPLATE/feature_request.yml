name: Feature request
description: Propose a new capability or an improvement.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Open a feature request before implementing new functionality and wait for design approval. See `CONTRIBUTING.md` for the pull request rules.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, and who has it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: How would you solve it? Alternatives are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API / MCP
        - Web app / dashboard
        - Viewer / rendering
        - Auth / OAuth
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I can open a pull request for this.
          required: false
