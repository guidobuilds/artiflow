name: Bug report
description: Report a reproducible defect in Artiflow.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Security problems must be reported privately. Use the **Report a security vulnerability** link on the new-issue page instead of opening a public issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the defect.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API / MCP
        - Web app / dashboard
        - Viewer / rendering
        - Auth / OAuth
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0-alpha.1 or commit SHA
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, PostgreSQL version, S3 provider and browser.
      placeholder: Node 24, PostgreSQL 16, R2, Firefox 140
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      render: shell
    validations:
      required: false
