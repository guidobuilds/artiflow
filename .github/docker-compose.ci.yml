services:
  postgres:
    pull_policy: always
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artiflow_test -d artiflow"]
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 5s
  garage:
    pull_policy: always
    healthcheck:
      test: ["CMD", "/garage", "health", "--quiet"]
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 15s
