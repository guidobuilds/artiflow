name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Check repository hygiene
        run: node scripts/check-hygiene.mjs

      - name: Boundaries
        run: bun run check:boundaries

      - name: Docs
        run: bun run check:docs

      - name: Install
        run: bun install --frozen-lockfile

      - name: Comments
        run: bun run check:comments

      - name: Effect fetches
        run: bun run check:effects

      - name: Audit dependencies
        run: bun run audit

      - name: Check changed files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-changed.mjs "$BASE_SHA"

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Web site
        run: bun run web:verify

      - name: Build
        run: bun run build

  opencode-plugin:
    name: opencode plugin packaging
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install
        run: bun install --frozen-lockfile
      - name: Plugin tests
        run: node --test test/opencode-plugin*.test.ts
      - name: Pack smoke
        run: |
          npm run build:plugin
          node plugins/opencode/scripts/pack-plugin.mjs verify
          (cd plugins/opencode && npm pack --ignore-scripts=false --pack-destination "$RUNNER_TEMP")
          mkdir "$RUNNER_TEMP/pack-check"
          tar -xzf "$RUNNER_TEMP"/artiflow-opencode-plugin-*.tgz -C "$RUNNER_TEMP/pack-check"
          cmp "$RUNNER_TEMP/pack-check/package/skills/creating-artifacts/SKILL.md" plugins/opencode/skills/creating-artifacts/SKILL.md
          cmp "$RUNNER_TEMP/pack-check/package/skills/using-artiflow/SKILL.md" plugins/opencode/skills/using-artiflow/SKILL.md
          cmp "$RUNNER_TEMP/pack-check/package/skills/opencode-large-artifacts/SKILL.md" plugins/opencode/skills/opencode-large-artifacts/SKILL.md
          test -f "$RUNNER_TEMP/pack-check/package/dist/server.mjs"
          test -f "$RUNNER_TEMP/pack-check/package/dist/gui-experimental.cjs"

  integration:
    name: integration
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install
        run: bun install --frozen-lockfile

      - name: Pull integration images
        run: |
          docker pull postgres:16-alpine
          docker pull dxflrs/garage:v2.4.1

      - name: Start PostgreSQL and Garage
        run: docker compose -f docker-compose.yml -f .github/docker-compose.ci.yml up -d --wait garage postgres

      - name: Wait for the database and bucket
        run: node --env-file=test/integration-config.example scripts/wait-integration-services.mjs

      - name: Migrate
        run: node --env-file=test/integration-config.example apps/api/src/adapters/postgres/db/migrate.ts

      - name: Integration tests
        run: bun run test:integration

      - name: Stop integration services
        if: always()
        run: docker compose -f docker-compose.yml -f .github/docker-compose.ci.yml down --volumes

  images:
    name: docker images
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
