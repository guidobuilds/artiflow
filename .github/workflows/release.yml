name: release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    uses: ./.github/workflows/verify.yml

  publish:
    name: publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tags must look like v1.2.3 or v1.2.3-rc.1, got \"$TAG\""
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: API image metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/artiflow-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push API image
        id: api-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          build-args: |
            ARTIFLOW_VERSION=${{ steps.api-meta.outputs.version }}
            ARTIFLOW_GIT_SHA=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Web image metadata
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/artiflow-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push web image
        id: web-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          build-args: |
            ARTIFLOW_VERSION=${{ steps.web-meta.outputs.version }}
            ARTIFLOW_GIT_SHA=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Sign images
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/artiflow-api@${{ steps.api-push.outputs.digest }}"
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/artiflow-web@${{ steps.web-push.outputs.digest }}"

  release:
    name: github release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          notes=$(cat <<'EOF'
          Container images for this release:

          - ghcr.io/guidobuilds/artiflow-api:__VERSION__
          - ghcr.io/guidobuilds/artiflow-web:__VERSION__

          Both are public and multi-arch (linux/amd64, linux/arm64), with an SBOM, provenance and a
          keyless cosign signature. Pin ARTIFLOW_VERSION=__VERSION__ in .env.prod and follow the upgrade
          steps in the self-hosting documentation.

              docker pull ghcr.io/guidobuilds/artiflow-api:__VERSION__
              docker pull ghcr.io/guidobuilds/artiflow-web:__VERSION__
          EOF
          )
          notes=${notes//__VERSION__/$version}
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; refreshing its assets"
          else
            args=()
            if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$TAG" \
              --verify-tag \
              --title "Artiflow ${version}" \
              --notes "$notes" \
              --generate-notes \
              "${args[@]}"
          fi
          gh release upload "$TAG" docker-compose.prod.yml env.prod.example --clobber
